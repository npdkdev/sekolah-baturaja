services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lpq_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8 --auth-local=trust --auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
      - ../db/migrations:/migrations:ro
      - ../db/seed.sql:/seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lpq_db"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Satu service menyajikan API dan frontend sekaligus. Tidak ada reverse proxy:
  # klien terhubung langsung, jadi RemoteAddr adalah alamat asli dan rate limit
  # login tidak perlu mempercayai X-Forwarded-For yang bisa dipalsukan.
  app:
    build:
      # Konteks di root repo karena image juga mem-build frontend.
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/lpq_db
    volumes:
      - uploads:/app/uploads
    ports:
      - "3000:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
